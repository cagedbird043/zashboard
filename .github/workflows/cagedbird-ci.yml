name: Cagedbird CI

on:
  push:
    branches:
      - singbox
      - 'cagedbird/candidate-*'
      - '!cagedbird/candidate-upstream-*'
  pull_request:
    branches:
      - singbox
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
    secrets:
      BOARD_DEPLOY_SSH_KEY:
        required: false
      BOARD_DEPLOY_KNOWN_HOSTS:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cagedbird-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/singbox' }}

env:
  HUSKY: '0'

jobs:
  checks:
    name: Typecheck, lint and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify synchronization invariants
        run: python3 scripts/ci/test-upstream-sync.py
      - name: Verify atomic deployment and rollback
        run: python3 scripts/deploy/test_deploy.py
      - name: Typecheck
        run: pnpm type-check
      - name: Lint without modifying files
        run: pnpm exec eslint .
      - name: Build all-fonts distribution
        run: pnpm build
      - name: Verify sandboxed Chrome and fix browser language
        run: |
          chrome_path=$(command -v google-chrome)
          "$chrome_path" --version
          "$chrome_path" --headless=new --dump-dom about:blank
          wrapper="$RUNNER_TEMP/zashboard-chrome"
          printf '#!/usr/bin/env bash\nexec %q --lang=en-US --accept-lang=en-US "$@"\n' "$chrome_path" > "$wrapper"
          chmod +x "$wrapper"
          echo "CHROME_BIN=$wrapper" >> "$GITHUB_ENV"
      - name: Proxy behavior smoke
        run: pnpm test:verify
      - name: Backend setup smoke
        run: pnpm test:setup
      - name: Collapse lifecycle smoke
        run: node test/collapse.mjs
      - name: Download the pinned native core
        id: native-core
        run: echo "binary=$(bash scripts/ci/download-sing-box.sh "$RUNNER_TEMP/native-core")" >> "$GITHUB_OUTPUT"
      - name: Native probe and provider smoke
        env:
          SING_BOX_BINARY: ${{ steps.native-core.outputs.binary }}
        run: node test/singbox.mjs
      - name: Seal the validated distribution
        run: python3 scripts/deploy/seal.py dist "$(git rev-parse HEAD)"
      - name: Upload all-fonts distribution
        uses: actions/upload-artifact@v6
        with:
          name: zashboard-all
          path: dist/
          if-no-files-found: error
          retention-days: 14

  fonts:
    name: Build (${{ matrix.font }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        font: [cdn, firasans, misans, pingfang, sarasa, none]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build font variant
        env:
          FONT: ${{ matrix.font }}
        run: pnpm build
      - name: Seal the distribution
        run: python3 scripts/deploy/seal.py dist "$(git rev-parse HEAD)"
      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: zashboard-${{ matrix.font }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [checks, fonts]
    if: >-
      github.repository == 'cagedbird043/zashboard' && inputs.source-ref == '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/singbox') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/singbox'))
    uses: ./.github/workflows/cagedbird-deploy.yml
    with:
      commit: ${{ github.sha }}
      artifact-run-id: ${{ github.run_id }}
    secrets:
      BOARD_DEPLOY_SSH_KEY: ${{ secrets.BOARD_DEPLOY_SSH_KEY }}
      BOARD_DEPLOY_KNOWN_HOSTS: ${{ secrets.BOARD_DEPLOY_KNOWN_HOSTS }}
