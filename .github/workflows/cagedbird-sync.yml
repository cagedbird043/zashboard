name: Cagedbird Upstream Sync

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cagedbird-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      old_sha: ${{ steps.plan.outputs.old_sha }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      candidate_branch: ${{ steps.plan.outputs.candidate_branch }}
      new_tag: ${{ steps.plan.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: singbox
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
      - name: Prepare a candidate from a stable upstream tag
        id: plan
        env:
          PLAN_FILE: ${{ runner.temp }}/upstream-plan.json
        run: |
          git config user.name 'cagedbird-board-bot'
          git config user.email 'cagedbird-board-bot@users.noreply.github.com'
          git config core.hooksPath /dev/null
          python3 scripts/ci/upstream-sync.py --output "$PLAN_FILE"
          python3 - <<'PY'
          import json, os
          plan = json.load(open(os.environ['PLAN_FILE']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('changed', 'old_sha', 'candidate_sha', 'candidate_branch', 'new_tag'):
                  value = plan.get(key, '')
                  if isinstance(value, bool):
                      value = str(value).lower()
                  print(f'{key}={value}', file=output)
          PY
      - name: Push only the candidate
        if: steps.plan.outputs.changed == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.plan.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ steps.plan.outputs.candidate_branch }}
        run: |
          previous=$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH")
          previous=${previous%%$'\t'*}
          git push "--force-with-lease=refs/heads/$CANDIDATE_BRANCH:$previous" origin "$CANDIDATE_SHA:refs/heads/$CANDIDATE_BRANCH"
      - name: Record the synchronization plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-plan
          path: ${{ runner.temp }}/upstream-plan.json
          if-no-files-found: warn
          retention-days: 30

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/cagedbird-ci.yml
    with:
      source-ref: ${{ needs.prepare.outputs.candidate_sha }}

  promote:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: singbox
          fetch-depth: 0
      - name: Promote the exact validated candidate with a lease
        env:
          OLD_SHA: ${{ needs.prepare.outputs.old_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
          NEW_TAG: ${{ needs.prepare.outputs.new_tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$OLD_SHA"
          git fetch origin "refs/heads/$CANDIDATE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git push "--force-with-lease=refs/heads/singbox:$OLD_SHA" origin "$CANDIDATE_SHA:refs/heads/singbox"
          printf '### 已晋升 %s\n\n旧提交：%s\n\n新提交：%s\n' "$NEW_TAG" "$OLD_SHA" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [prepare, promote]
    uses: ./.github/workflows/cagedbird-deploy.yml
    with:
      commit: ${{ needs.prepare.outputs.candidate_sha }}
      artifact-run-id: ${{ github.run_id }}
    secrets:
      BOARD_DEPLOY_SSH_KEY: ${{ secrets.BOARD_DEPLOY_SSH_KEY }}
      BOARD_DEPLOY_KNOWN_HOSTS: ${{ secrets.BOARD_DEPLOY_KNOWN_HOSTS }}

  cleanup:
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: singbox
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
      - name: Remove the successfully deployed candidate
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: git push "--force-with-lease=refs/heads/$CANDIDATE_BRANCH:$CANDIDATE_SHA" origin ":refs/heads/$CANDIDATE_BRANCH"
