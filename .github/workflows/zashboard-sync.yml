name: Zashboard official release promotion

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: zashboard-official-release-promotion
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Zephyruso/zashboard
  FORK_REPOSITORY: ${{ github.repository }}
  PROVIDER_BRANCH: cagedbird/providers
  SYNC_OUTPUT_DIR: ${{ github.workspace }}/sync-output

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.ZASHBOARD_AUTO_PROMOTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main_changed: ${{ steps.prepare.outputs.main_changed }}
      provider_changed: ${{ steps.prepare.outputs.provider_changed }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun automation/zashboard-sync.ts prepare
      - if: always()
        run: cp automation/zashboard-sync.ts "$SYNC_OUTPUT_DIR/runner.ts"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zashboard-sync-candidate
          path: ${{ env.SYNC_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 1

  validate:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.provider_changed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zashboard-sync-candidate
          path: ${{ env.SYNC_OUTPUT_DIR }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: bun "$SYNC_OUTPUT_DIR/runner.ts" validate

  promote:
    needs: [prepare, validate]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.main_changed == 'true' || needs.prepare.outputs.provider_changed == 'true') &&
      (needs.prepare.outputs.provider_changed != 'true' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zashboard-sync-candidate
          path: ${{ env.SYNC_OUTPUT_DIR }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Configure least-privilege fork credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Promote validated refs with an exact lease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun automation/zashboard-sync.ts promote

  notify:
    needs: [prepare, validate, promote]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || vars.ZASHBOARD_AUTO_PROMOTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zashboard-sync-candidate
          path: ${{ env.SYNC_OUTPUT_DIR }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Reconcile durable issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: bun automation/zashboard-sync.ts notify
